services:
  postgres:
    image: postgres:16-alpine
    container_name: ft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatoria em producao}
      POSTGRES_DB: ${DB_NAME:-escala_ft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-escala_ft}" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ft-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft-backend
    restart: unless-stopped
    command: node server.js
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatoria em producao}
      DB_NAME: ${DB_NAME:-escala_ft}
      DB_PORT: 5432
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio em producao}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gsvr.192.168.1.18.nip.io,http://192.168.1.18:5173,https://gsvr.45.234.245.204.nip.io:36419}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    networks:
      - ft-network
      - nginx-npm_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ft-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ft-network
      - nginx-npm_default

volumes:
  pgdata:
    external: true
    name: gsvr-prod_pgdata

networks:
  ft-network:
    driver: bridge
  nginx-npm_default:
    external: true
