services:
  # Base Database
  postgres:
    image: postgres:16-alpine
    container_name: ft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-escala_ft}
    # Removido o expose da porta 5432 para evitar conflito com Postgres local do servidor.
    # O backend e pgadmin ainda acessam internamente.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ft-network

  # Database Admin
  pgadmin:
    image: dpage/pgadmin4
    container_name: ft-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mil.br
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ft-network
      - nginx-npm_default

  # Container Admin
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ft-portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - ft-network

  # API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft-backend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-escala_ft}
      DB_PORT: 5432
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    networks:
      - ft-network
      - nginx-npm_default

  # Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - ./frontend/.env
    environment:
      # As variáveis VITE_ são carregadas automaticamente do arquivo ./frontend/.env via env_file
      NODE_ENV: development
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    networks:
      - ft-network
      - nginx-npm_default

networks:
  ft-network:
    driver: bridge
  #rede do proxy reverse
  nginx-npm_default:
    external: true

volumes:
  pgdata:
  portainer_data:
  backend_node_modules:
  frontend_node_modules:
